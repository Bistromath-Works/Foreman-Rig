name: foreman-auditor
version: "3.0"
description: "Foreman auditor (optional) - whole-repo audits on a schedule, and fresh eyes when a job is stuck"

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [systematic-debugging]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
