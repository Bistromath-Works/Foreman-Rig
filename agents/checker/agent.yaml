name: foreman-checker
version: "3.0"
description: "Foreman checker - independent gate: runs the real code and tries to break it; never edits app code"

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [systematic-debugging, verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
