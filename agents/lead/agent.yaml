name: foreman-lead
version: "2.0"
description: "Foreman lead - runs the gated pipeline and talks to the human, never writes code"

imports:
  - ref: local:../shared

profiles:
  default:
    uses:
      skills: [verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
