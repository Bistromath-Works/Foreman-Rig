# Foreman: an OpenRig setup (not a skill).
#
# Don't edit this file. `scripts/foreman init <project>` copies it to rig.<project>.yaml
# (gitignored) and sets the name. In that copy, replace every SET-ME:
#   runtime: claude-code | codex | pi
#   model:   a model that runtime can run (see docs/models.md)
# The auditor is optional: `init --auditor` keeps its block, plain `init` removes it.
# `scripts/foreman check <project>` refuses to launch while any SET-ME is left.

version: "0.2"
name: SET-ME
summary: >
  Foreman: an owner that plans, builds and owns the repo, and an independent checker that runs
  the code and tries to break it. Nothing merges without the checker's PASS. The human is asked
  only about big decisions, serious failures and domain knowledge.

culture_file: CULTURE.md

# OpenRig writes its instruction blocks for Claude seats here, so your CLAUDE.md is untouched.
managed_blocks:
  claude-code: CLAUDE.local.md

docs:
  - path: README.md
  - path: SETUP.md
  - path: docs/models.md

pods:
  - id: crew
    label: Foreman crew
    members:
      - id: owner
        agent_ref: "local:agents/owner"
        runtime: SET-ME
        model: SET-ME
        profile: default
        cwd: "."
      - id: checker
        agent_ref: "local:agents/checker"
        runtime: SET-ME
        model: SET-ME
        profile: default
        cwd: "."
      # --- auditor (optional): kept by `init --auditor` ---
      - id: auditor
        agent_ref: "local:agents/auditor"
        runtime: SET-ME
        model: SET-ME
        profile: default
        cwd: "."
      # --- end auditor ---
    edges:
      - {kind: delegates_to, from: owner, to: checker}
      - {kind: delegates_to, from: owner, to: auditor}  # auditor edge: removed with the auditor block

edges: []
